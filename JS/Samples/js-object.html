<html>

<head>
    <title>JS Object</title>
</head>

<body>
    <script>
        function myFunction() {
            let student = {
                'name': "Vijay",
                'age': 24,
            }
            document.getElementById("demo").innerHTML = "Hi " + student.name;
        }
    </script>
    <p id="demo">JS Object</p>
    <button onclick="myFunction()">Click Me</button>
</body>

</html>
