<html>

<head>
    <title>innerHTML sample</title>
</head>

<body>
    <center>
        <p id="demo">Content page</p>
        <button onclick="Click()">Click this button </button>
    </center>
    <script>
        function Click() {
            document.getElementById("demo").innerHTML = "<h2>Hi Vijay this is innerHTML sample</h2>";
        }
    </script>
</body>

</html>
